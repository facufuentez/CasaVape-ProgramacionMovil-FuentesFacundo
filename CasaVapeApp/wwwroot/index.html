<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CasaVape</title>
    <base href="/" />

    <script>
        (function () {
            try {
                var guardado = localStorage.getItem('theme');
                if (guardado === 'dark' || guardado === 'light') {
                    document.documentElement.setAttribute('data-bs-theme', guardado);
                }
            } catch (e) {
            }
        })();
    </script>

    <link rel="stylesheet" href="lib/bootswatch/zephyr/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="CasaVapeApp.styles.css" />
    <link rel="icon" href="data:," />
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.casaVape = {
            openSidebar: () => document.body.classList.add('sidebar-open'),
            closeSidebar: () => document.body.classList.remove('sidebar-open'),
            setTheme: (theme) => {
                document.documentElement.setAttribute('data-bs-theme', theme);
                try { localStorage.setItem('theme', theme); } catch (e) { }
            }
        };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
